# Render Blueprint: one web service (API + built React app) and a Postgres database.
# Render → New → Blueprint → pick this repo. It asks for MISTRAL_API_KEY once.
services:
  - type: web
    name: medslot
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medslot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: MISTRAL_MODEL
        value: open-mistral-nemo
      - key: MISTRAL_API_KEY
        sync: false

databases:
  - name: medslot-db
    plan: free
    databaseName: medslot
